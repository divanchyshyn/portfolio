name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Run tests
        run: npm run test
      - name: Build
        run: npm run build

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      # Serves dist/ statically and asserts the budgets in lighthouserc.json:
      # performance >= 95, accessibility = 100, best-practices >= 95, seo >= 90.
      - name: Assert Lighthouse budgets
        run: npx --yes @lhci/cli@0.15.x autorun